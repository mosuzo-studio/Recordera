<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recordera — Screen recorder</title>
<meta name="description" content="Choose your language to continue to Recordera.">
<link rel="canonical" href="https://recordera.mosuzo.com/">

<!-- 多语言：请把 recordera.mosuzo.com 替换成你的真实域名 -->
<link rel="alternate" hreflang="en" href="https://recordera.mosuzo.com/en/">
<link rel="alternate" hreflang="zh-Hans" href="https://recordera.mosuzo.com/zh-Hans/">
<link rel="alternate" hreflang="x-default" href="https://recordera.mosuzo.com/">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">

<!-- ================= 预发布提示 ================= -->
<div class="topbar">
  <span class="inner">
    <span class="dot"></span>
    <span lang="zh-Hans">预发布版本</span>
    <span class="sep">|</span>
    <span lang="en">Pre-release</span>
  </span>
</div>

<main class="splash">
  <span class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="1.6" y="1.6" width="20.8" height="20.8" rx="6.4" fill="#111111"/>
      <circle cx="12" cy="12" r="4.7" fill="#e5484d"/>
    </svg>
    Recordera
  </span>

  <h1>Choose your language</h1>
  <p>选择你的语言</p>

  <div class="splash-links">
    <a class="splash-card" href="en/" hreflang="en">
      <strong>English</strong>
      <span>Turns what you do on screen into a video you can send.</span>
    </a>
    <a class="splash-card" href="zh-Hans/" hreflang="zh-Hans" lang="zh-Hans">
      <strong>简体中文</strong>
      <span>把屏幕上的操作，录成能直接发的视频。</span>
    </a>
  </div>
</main>

</div>

</body>
